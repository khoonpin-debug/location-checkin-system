<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Location Check-in</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .status-box {
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: center;
            border: 2px solid transparent;
        }

        .loading {
            background: #e3f2fd;
            border-color: #bbdefb;
            color: #1565c0;
        }

        .success {
            background: #e8f5e8;
            border-color: #c8e6c9;
            color: #2e7d32;
        }

        .error {
            background: #ffebee;
            border-color: #ffcdd2;
            color: #c62828;
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .button-secondary {
            background: #6c757d;
        }

        .info-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 12px;
            color: #6c757d;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .progress-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 3s ease;
        }

        .coordinates {
            font-family: 'Courier New', monospace;
            background: #2d3748;
            color: #68d391;
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="icon">📍</div>
            <h1>Secure Location Check-in</h1>
            <p>You must be physically present at the location</p>
        </div>

        <div class="content">
            <div id="status-box" class="status-box loading">
                <div class="pulse">🔍</div>
                <h3>Checking Your Location</h3>
                <p>Please allow location access when prompted</p>
                <div class="progress-bar">
                    <div id="progress" class="progress"></div>
                </div>
            </div>

            <button id="retry-btn" class="button button-secondary" style="display: none;">
                🔄 Retry Location Check
            </button>

            <div id="info-box" class="info-box" style="display: none;">
                <strong>Location Details:</strong>
                <div id="coordinates"></div>
                <div id="distance-info"></div>
            </div>

            <div id="success-box" style="display: none;">
                <button id="continue-btn" class="button">
                    ✅ Continue to Check-in Form
                </button>
            </div>
        </div>
    </div>

    <script>
        // ================= CONFIGURATION =================
        // UPDATE THESE VALUES WITH YOUR ACTUAL LOCATION
        const CONFIG = {
            targetLocation: {
                latitude: 5.327755,        // REPLACE with your latitude
                longitude: 100.304158,     // REPLACE with your longitude  
                name: "PGAT 8 OFFICE",     // REPLACE with location name
                address: "Halaman Kampung Jawa, Kawasan Perindustrian Bayan Lepas, 11900 Bayan Lepas, Pulau Pinang"  // REPLACE with address
            },
            allowedDistance: 0.05,        // Maximum distance in km (50 meters)
            // minAccuracy: 20,        // Require GPS accuracy better than 20 meters
            // maxAttempts: 3          // Allow multiple attempts
            googleForm: {
                baseUrl: "https://docs.google.com/forms/d/e/1Dw9hvs3XjQHPvsatmUDUbxOO9eWbHaZ2GggH7OWQZgE/viewform",
                fields: {
                    location: "entry.28459228",
                    latitude: "entry.1866379558", 
                    longitude: "entry.435829576",
                    distance: "entry.219126946",
                    accuracy: "entry.793131960"
                }
            }
        };
        // ================= END CONFIGURATION =================

        const elements = {
            statusBox: document.getElementById('status-box'),
            retryBtn: document.getElementById('retry-btn'),
            infoBox: document.getElementById('info-box'),
            coordinates: document.getElementById('coordinates'),
            distanceInfo: document.getElementById('distance-info'),
            successBox: document.getElementById('success-box'),
            continueBtn: document.getElementById('continue-btn'),
            progress: document.getElementById('progress')
        };

        let attemptCount = 0;
        let userLocation = null;

        // Start verification when page loads
        window.addEventListener('load', () => {
            startProgressAnimation();
            setTimeout(verifyLocation, 1000);
        });

        elements.retryBtn.addEventListener('click', verifyLocation);
        elements.continueBtn.addEventListener('click', redirectToGoogleForm);

        function startProgressAnimation() {
            elements.progress.style.width = '100%';
        }

        function verifyLocation() {
            attemptCount++;
            if (attemptCount > 3) {
                showMaxAttemptsReached();
                return;
            }

            resetUI();
            elements.statusBox.className = 'status-box loading';
            elements.statusBox.innerHTML = `
                <div class="pulse">🔍</div>
                <h3>Checking Your Location</h3>
                <p>Requesting GPS access...</p>
                <div class="progress-bar">
                    <div class="progress" style="width: 100%"></div>
                </div>
            `;

            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser. Please use Chrome, Safari, or Firefox.');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                handleLocationSuccess,
                handleLocationError,
                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        }

        function handleLocationSuccess(position) {
            userLocation = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy
            };

            const distance = calculateDistance(
                userLocation.latitude,
                userLocation.longitude,
                CONFIG.targetLocation.latitude,
                CONFIG.targetLocation.longitude
            );

            const distanceMeters = distance * 1000;

            // Update UI with location info
            elements.coordinates.innerHTML = `
                📍 Your Location: ${userLocation.latitude.toFixed(6)}, ${userLocation.longitude.toFixed(6)}<br>
                🎯 GPS Accuracy: ${userLocation.accuracy} meters
            `;

            elements.distanceInfo.innerHTML = `
                🏢 Target: ${CONFIG.targetLocation.name}<br>
                📏 Distance: ${distanceMeters.toFixed(0)} meters
            `;

            elements.infoBox.style.display = 'block';

            if (distance <= CONFIG.allowedDistance) {
                showSuccess(distanceMeters);
            } else {
                showError(
                    `You are ${distanceMeters.toFixed(0)} meters away from ${CONFIG.targetLocation.name}. ` +
                    `Maximum allowed distance is ${(CONFIG.allowedDistance * 1000).toFixed(0)} meters.`
                );
            }
        }

        function handleLocationError(error) {
            let message = '';
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    message = 'Location access was denied. Please allow location access in your browser settings and try again.';
                    break;
                case error.POSITION_UNAVAILABLE:
                    message = 'Location information is unavailable. Please check your GPS signal and try again.';
                    break;
                case error.TIMEOUT:
                    message = 'Location request timed out. Please check your internet connection and try again.';
                    break;
                default:
                    message = 'An unknown error occurred while getting your location. Please try again.';
                    break;
            }
            showError(message);
        }

        function showSuccess(distanceMeters) {
            elements.statusBox.className = 'status-box success';
            elements.statusBox.innerHTML = `
                <div>✅</div>
                <h3>Location Verified!</h3>
                <p>You are at ${CONFIG.targetLocation.name}</p>
                <p><small>Distance: ${distanceMeters.toFixed(0)} meters</small></p>
            `;
            elements.successBox.style.display = 'block';
            elements.retryBtn.style.display = 'none';
        }

        function showError(message) {
            elements.statusBox.className = 'status-box error';
            elements.statusBox.innerHTML = `
                <div>❌</div>
                <h3>Access Denied</h3>
                <p>${message}</p>
            `;
            elements.retryBtn.style.display = 'block';
            elements.successBox.style.display = 'none';
        }

        function resetUI() {
            elements.retryBtn.style.display = 'none';
            elements.successBox.style.display = 'none';
            elements.infoBox.style.display = 'none';
            userLocation = null;
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function redirectToGoogleForm() {
            if (!userLocation) return;

            const params = new URLSearchParams({
                [CONFIG.googleForm.fields.location]: CONFIG.targetLocation.name,
                [CONFIG.googleForm.fields.latitude]: userLocation.latitude.toFixed(6),
                [CONFIG.googleForm.fields.longitude]: userLocation.longitude.toFixed(6),
                [CONFIG.googleForm.fields.distance]: (calculateDistance(
                    userLocation.latitude,
                    userLocation.longitude,
                    CONFIG.targetLocation.latitude,
                    CONFIG.targetLocation.longitude
                ) * 1000).toFixed(0),
                [CONFIG.googleForm.fields.accuracy]: userLocation.accuracy.toFixed(0),
            });

            window.location.href = `${CONFIG.googleForm.baseUrl}?${params.toString()}`;
        }

        function showMaxAttemptsReached() {
            elements.statusBox.className = 'status-box error';
            elements.statusBox.innerHTML = `
                <div>🚫</div>
                <h3>Maximum 3 Attempts Reached</h3>
                <p>Please contact administrator for assistance.</p>
                <p><small>Refresh the page to start over</small></p>
    `        ;
            elements.retryBtn.style.display = 'none';
            elements.successBox.style.display = 'none';
        }
         
    </script>
</body>

</html>
